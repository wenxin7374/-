name: 自动编译未签名 IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 整理目录结构（兼容网页上传的嵌套）
        run: |
          echo "===== 整理前的结构 ====="
          find . -maxdepth 4 -type f $ -name '*.swift' -o -name 'project.pbxproj' -o -name 'index.html' -o -name 'xlsx.full.min.js' $ | sort

          PROJ=$(find . -name project.pbxproj | sort | tail -1)
          if [ -z "$PROJ" ]; then
            echo "错误：仓库里找不到 project.pbxproj"; exit 1
          fi
          PROJ_DIR=$(dirname "$PROJ")
          ROOT_DIR=$(dirname "$PROJ_DIR")
          SRC="$ROOT_DIR/WatermarkCamera"
          if [ ! -d "$SRC" ]; then
            echo "错误：工程同级找不到 WatermarkCamera 源码目录: $SRC"; exit 1
          fi
          echo "选定工程根目录: $ROOT_DIR"

          if [ "$ROOT_DIR" != "." ]; then
            echo "检测到嵌套，正在拍平到仓库根目录 ..."
            cp -R "$ROOT_DIR"/. ./
            echo "拍平完成"
          fi

          echo "===== 确认关键文件 ====="
          test -f WatermarkCamera/RouteView.swift && echo "RouteView.swift OK" || echo "警告: RouteView.swift 缺失"
          test -d WatermarkCamera/RouteWeb && echo "RouteWeb OK" || echo "警告: RouteWeb 缺失"

      - name: 编译（关闭签名，产出未签名 .app）
        run: |
          xcodebuild \
            -project WatermarkCamera.xcodeproj \
            -scheme WatermarkCamera \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: 打包为 IPA
        run: |
          APP="$(find ./DerivedData/Build/Products -name 'WatermarkCamera.app' -type d | head -1)"
          if [ -z "$APP" ]; then
            echo "错误：未找到编译产物 WatermarkCamera.app"
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry WatermarkCamera-unsigned.ipa Payload
          ls -lh WatermarkCamera-unsigned.ipa

      - name: 提供下载
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkCamera-IPA-未签名
          path: WatermarkCamera-unsigned.ipa
          retention-days: 30
